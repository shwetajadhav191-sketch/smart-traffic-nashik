<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Traffic Problem - Smart Traffic Nashik</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    

</head>


<body>

    <header class="header">

        <h1>
            <i class="fa-solid fa-file-circle-exclamation"></i>
            Report a Traffic Problem
        </h1>

    </header>


    <main class="container">

        <div class="complaint-box">

            <h2>What's the problem?</h2>

            <p class="subtitle">
                Select a category and describe the issue.
            </p>


            <div class="categories">

                <button class="category" onclick="selectCategory(this, 'Traffic Jam')">
                    <i class="fa-solid fa-car"></i>
                    Traffic Jam
                </button>

                <button class="category" onclick="selectCategory(this, 'Accident')">
                    <i class="fa-solid fa-car-burst"></i>
                    Accident
                </button>

                <button class="category" onclick="selectCategory(this, 'Road Block')">
                    <i class="fa-solid fa-road-barrier"></i>
                    Road Block
                </button>

                <button class="category" onclick="selectCategory(this, 'Signal Problem')">
                    <i class="fa-solid fa-traffic-light"></i>
                    Signal Problem
                </button>

                <button class="category" onclick="selectCategory(this, 'Damaged Road')">
                    <i class="fa-solid fa-road"></i>
                    Damaged Road
                </button>

                <button class="category" onclick="selectCategory(this, 'Illegal Parking')">
                    <i class="fa-solid fa-square-parking"></i>
                    Illegal Parking
                </button>

            </div>


            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="Example: Dwarka, Nashik"
            >


            <label for="description">
                Describe the problem
            </label>

            <textarea
                id="description"
                placeholder="Describe the traffic problem..."
            ></textarea>


            <button class="submit-btn" onclick="submitComplaint()">

                <i class="fa-solid fa-paper-plane"></i>

                Submit Complaint

            </button>

        </div>

    </main>


    <script>

        let selectedCategory = "";

        function selectCategory(button, category) {

            document.querySelectorAll(".category").forEach(function(item) {
                item.classList.remove("selected");
            });

            button.classList.add("selected");

            selectedCategory = category;
        }


        function submitComplaint() {

            let location =
                document.getElementById("location").value;

            let description =
                document.getElementById("description").value;


            if (selectedCategory === "") {

                alert("Please select a problem category.");

                return;
            }


            if (location === "") {

                alert("Please enter the location.");

                return;
            }


            if (description === "") {

                alert("Please describe the problem.");

                return;
            }


            alert(
                "Complaint submitted successfully!\n\n" +
                "Category: " + selectedCategory +
                "\nLocation: " + location
            );

        }

    </script>

</body>

</html>
