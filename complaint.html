<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Traffic Problem - Smart Traffic Nashik</title>


</head>


<body>


    <!-- =========================
     HEADER
========================= -->

    <header class="header">

        <h1>

            <img class="header-icon" src="https://img.icons8.com/3d-fluency/94/complaint.png" alt="Report">

            Report a Traffic Problem

        </h1>

    </header>


    <!-- =========================
     MAIN
========================= -->

    <main class="container">

        <div class="complaint-box">


            <h2>
                What's the problem?
            </h2>


            <p class="subtitle">
                Select a category and describe the issue.
            </p>


            <!-- =========================
             CATEGORY ICONS
        ========================= -->

            <div class="categories">


                <!-- TRAFFIC JAM -->

                <button class="category" onclick="selectCategory(this, 'Traffic Jam')">

                    <div class="icon-circle blue">

                        <img src="https://img.icons8.com/3d-fluency/94/car.png" alt="Traffic Jam">

                    </div>

                    <span>
                        Traffic Jam
                    </span>

                </button>


                <!-- ACCIDENT -->

                <button class="category" onclick="selectCategory(this, 'Accident')">

                    <div class="icon-circle pink">

                        <img src="https://img.icons8.com/3d-fluency/94/car-crash.png" alt="Accident">

                    </div>

                    <span>
                        Accident
                    </span>

                </button>


                <!-- ROAD BLOCK -->

                <button class="category" onclick="selectCategory(this, 'Road Block')">

                    <div class="icon-circle yellow">

                        <img src="https://img.icons8.com/3d-fluency/94/traffic-barricade.png" alt="Road Block">

                    </div>

                    <span>
                        Road Block
                    </span>

                </button>


                <!-- SIGNAL -->

                <button class="category" onclick="selectCategory(this, 'Signal Problem')">

                    <div class="icon-circle pink">

                        <img src="https://img.icons8.com/3d-fluency/94/traffic-light.png" alt="Signal Problem">

                    </div>

                    <span>
                        Signal Problem
                    </span>

                </button>


                <!-- DAMAGED ROAD -->

                <button class="category" onclick="selectCategory(this, 'Damaged Road')">

                    <div class="icon-circle peach">

                        <img src="https://img.icons8.com/3d-fluency/94/road.png" alt="Damaged Road">

                    </div>

                    <span>
                        Damaged Road
                    </span>

                </button>


                <!-- ILLEGAL PARKING -->

                <button class="category" onclick="selectCategory(this, 'Illegal Parking')">

                    <div class="icon-circle lavender">

                        <img src="https://img.icons8.com/3d-fluency/94/parking.png" alt="Illegal Parking">

                    </div>

                    <span>
                        Illegal Parking
                    </span>

                </button>


                <!-- POTHOLE -->

                <button class="category" onclick="selectCategory(this, 'Pothole')">

                    <div class="icon-circle blue">

                        <img src="https://img.icons8.com/3d-fluency/94/road-closure.png" alt="Pothole">

                    </div>

                    <span>
                        Pothole
                    </span>

                </button>


                <!-- WRONG SIDE -->

                <button class="category" onclick="selectCategory(this, 'Wrong Side Driving')">

                    <div class="icon-circle cyan">

                        <img src="https://img.icons8.com/3d-fluency/94/no-entry.png" alt="Wrong Side Driving">

                    </div>

                    <span>
                        Wrong Side Driving
                    </span>

                </button>


                <!-- STREET LIGHT -->

                <button class="category" onclick="selectCategory(this, 'Street Light')">

                    <div class="icon-circle yellow">

                        <img src="https://img.icons8.com/3d-fluency/94/street-lamp.png" alt="Street Light">

                    </div>

                    <span>
                        Street Light
                    </span>

                </button>


                <!-- WATERLOGGING -->

                <button class="category" onclick="selectCategory(this, 'Waterlogging')">

                    <div class="icon-circle blue">

                        <img src="https://img.icons8.com/3d-fluency/94/water.png" alt="Waterlogging">

                    </div>

                    <span>
                        Waterlogging
                    </span>

                </button>


                <!-- SIGN BOARD -->

                <button class="category" onclick="selectCategory(this, 'Missing Sign Board')">

                    <div class="icon-circle peach">

                        <img src="https://img.icons8.com/3d-fluency/94/signpost.png" alt="Missing Sign Board">

                    </div>

                    <span>
                        Missing Sign Board
                    </span>

                </button>


                <!-- TRAFFIC VIOLATION -->

                <button class="category" onclick="selectCategory(this, 'Traffic Rule Violation')">

                    <div class="icon-circle pink">

                        <img src="https://img.icons8.com/3d-fluency/94/error.png" alt="Traffic Rule Violation">

                    </div>

                    <span>
                        Traffic Rule Violation
                    </span>

                </button>


            </div>


            <!-- SELECTED CATEGORY -->

            <div id="selectedCategory" class="selected-category">

            </div>


            <!-- LOCATION -->

            <label for="location">
                Location
            </label>


            <input type="text" id="location" placeholder="Example: Dwarka, Nashik">


            <!-- DESCRIPTION -->

            <label for="description">
                Describe the problem
            </label>


            <textarea id="description" placeholder="Describe the traffic problem..."></textarea>


            <!-- SUBMIT -->

            <button class="submit-btn" onclick="submitComplaint()">

                ➤ &nbsp; Submit Complaint

            </button>


        </div>

    </main>




</body>

</html>
