<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Traffic Problem - Smart Traffic Nashik</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css\complaint.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <h1>
            <i class="fa-solid fa-triangle-exclamation header-icon"></i>
            Report a Traffic Problem
        </h1>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">

        <div class="complaint-box">


            <h2>
                What's the problem?
            </h2>

            <p class="subtitle">
                Select a category and describe the issue.
            </p>


            <!-- =========================
                 CATEGORY GRID
            ========================= -->

            <div class="categories">


                <!-- TRAFFIC JAM -->

                <button type="button" class="category" onclick="selectCategory(this, 'Traffic Jam')">

                    <div class="icon-circle traffic-jam">

                        <img src="https://img.icons8.com/3d-fluency/94/car.png" alt="Traffic Jam">

                    </div>

                    <span class="category-name">
                        Traffic Jam
                    </span>

                </button>


                <!-- ACCIDENT -->

                <button type="button" class="category" onclick="selectCategory(this, 'Accident')">

                    <div class="icon-circle accident">

                        <svg class="accident-icon" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">

                            <path d="M22 65 L30 43 Q33 37 42 37 H78 Q87 37 90 44 L98 65 V78 H22 Z" fill="#e53935" />

                            <path d="M36 42 L43 25 H76 L86 42 Z" fill="#ff6b6b" />

                            <path d="M45 29 H56 V40 H40 Z" fill="#dff4ff" />

                            <path d="M59 29 H73 L80 40 H59 Z" fill="#dff4ff" />

                            <circle cx="38" cy="77" r="10" fill="#292929" />
                            <circle cx="82" cy="77" r="10" fill="#292929" />

                            <circle cx="38" cy="77" r="4" fill="#bdbdbd" />
                            <circle cx="82" cy="77" r="4" fill="#bdbdbd" />

                            <rect x="25" y="53" width="9" height="7" rx="3" fill="#fff176" />

                            <rect x="86" y="53" width="9" height="7" rx="3" fill="#fff176" />

                            <path d="M102 28 L113 18" stroke="#ff9800" stroke-width="5" stroke-linecap="round" />

                            <path d="M106 40 L118 37" stroke="#ff9800" stroke-width="5" stroke-linecap="round" />

                            <path d="M102 15 L106 5" stroke="#ff9800" stroke-width="5" stroke-linecap="round" />

                        </svg>

                    </div>

                    <span class="category-name">
                        Accident
                    </span>

                </button>


                <!-- ROAD BLOCK -->

                <button type="button" class="category" onclick="selectCategory(this, 'Road Block')">

                    <div class="icon-circle road-block">

                        <img src="https://img.icons8.com/3d-fluency/94/traffic-barricade.png" alt="Road Block">

                    </div>

                    <span class="category-name">
                        Road Block
                    </span>

                </button>


                <!-- SIGNAL PROBLEM -->

                <button type="button" class="category" onclick="selectCategory(this, 'Signal Problem')">

                    <div class="icon-circle signal">

                        <img src="https://img.icons8.com/3d-fluency/94/traffic-light.png" alt="Signal Problem">

                    </div>

                    <span class="category-name">
                        Signal Problem
                    </span>

                </button>


                <!-- DAMAGED ROAD -->

                <button type="button" class="category" onclick="selectCategory(this, 'Damaged Road')">

                    <div class="icon-circle damaged-road">

                        <img src="https://img.icons8.com/3d-fluency/94/road.png" alt="Damaged Road">

                    </div>

                    <span class="category-name">
                        Damaged Road
                    </span>

                </button>


                <!-- ILLEGAL PARKING -->

                <button type="button" class="category" onclick="selectCategory(this, 'Illegal Parking')">

                    <div class="icon-circle parking">

                        <img src="https://img.icons8.com/3d-fluency/94/parking.png" alt="Illegal Parking">

                    </div>

                    <span class="category-name">
                        Illegal Parking
                    </span>

                </button>


                <!-- POTHOLE -->

                <button type="button" class="category" onclick="selectCategory(this, 'Pothole')">

                    <div class="icon-circle pothole">

                        <img src="https://img.icons8.com/3d-fluency/94/road-closure.png" alt="Pothole">

                    </div>

                    <span class="category-name">
                        Pothole
                    </span>

                </button>


                <!-- WRONG SIDE DRIVING -->

                <button type="button" class="category" onclick="selectCategory(this, 'Wrong Side Driving')">

                    <div class="icon-circle wrong-side">

                        <img src="https://img.icons8.com/3d-fluency/94/no-entry.png" alt="Wrong Side Driving">

                    </div>

                    <span class="category-name">
                        Wrong Side Driving
                    </span>

                </button>


                <!-- STREET LIGHT -->

                <button type="button" class="category" onclick="selectCategory(this, 'Street Light')">

                    <div class="icon-circle street-light">

                        <img src="https://img.icons8.com/3d-fluency/94/street-lamp.png" alt="Street Light">

                    </div>

                    <span class="category-name">
                        Street Light
                    </span>

                </button>


                <!-- WATERLOGGING -->

                <button type="button" class="category" onclick="selectCategory(this, 'Waterlogging')">

                    <div class="icon-circle water">

                        <img src="https://img.icons8.com/3d-fluency/94/water.png" alt="Waterlogging">

                    </div>

                    <span class="category-name">
                        Waterlogging
                    </span>

                </button>


                <!-- MISSING SIGN BOARD -->

                <button type="button" class="category" onclick="selectCategory(this, 'Missing Sign Board')">

                    <div class="icon-circle sign-board">

                        <img src="https://img.icons8.com/3d-fluency/94/signpost.png" alt="Missing Sign Board">

                    </div>

                    <span class="category-name">
                        Missing Sign Board
                    </span>

                </button>


                <!-- TRAFFIC RULE VIOLATION -->

                <button type="button" class="category" onclick="selectCategory(this, 'Traffic Rule Violation')">

                    <div class="icon-circle violation">

                        <img src="https://img.icons8.com/3d-fluency/94/error.png" alt="Traffic Rule Violation">

                    </div>

                    <span class="category-name">
                        Traffic Rule Violation
                    </span>

                </button>


            </div>


            <!-- =========================
                 SELECTED CATEGORY
            ========================= -->

            <div id="selectedCategory" class="selected-category">

            </div>


            <!-- =========================
                 LOCATION
            ========================= -->

            <label for="location">
                Location
            </label>

            <input type="text" id="location" placeholder="Example: Dwarka, Nashik">


            <!-- =========================
                 DESCRIPTION
            ========================= -->

            <label for="description">
                Describe the problem
            </label>

            <textarea id="description" placeholder="Describe the traffic problem..."></textarea>


            <!-- =========================
                 SUBMIT
            ========================= -->

            <button type="button" class="submit-btn" onclick="submitComplaint()">

                <i class="fa-solid fa-paper-plane"></i>
                &nbsp; Submit Complaint

            </button>


            <!-- SUCCESS MESSAGE -->

            <div id="successMessage" class="success-message">

            </div>


        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/complaint.js"></script>

</body>

</html>
