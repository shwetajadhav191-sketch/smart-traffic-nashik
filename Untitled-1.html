<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report Traffic Problem - Smart Traffic Nashik</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f3f6ff;
            color: #142b5a;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            background: white;
            padding: 28px 20px;
            text-align: center;

            box-shadow:
                0 2px 15px rgba(50, 70, 150, 0.08);
        }


        .header h1 {
            color: #6254e8;
            font-size: 38px;
            font-weight: 700;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }


        .header-icon {
            width: 58px;
            height: 58px;

            object-fit: contain;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            width: 90%;
            max-width: 900px;

            margin: 35px auto;
        }


        /* =========================
           CARD
        ========================= */

        .complaint-box {

            background: rgba(255,255,255,0.96);

            padding: 35px 45px;

            border-radius: 25px;

            box-shadow:
                0 10px 35px rgba(73, 92, 180, 0.12);
        }


        .complaint-box h2 {

            font-size: 34px;

            margin-bottom: 10px;

            color: #132d61;
        }


        .subtitle {

            color: #6d7fa6;

            font-size: 19px;

            margin-bottom: 28px;
        }


        /* =========================
           CATEGORY GRID
        ========================= */

        .categories {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 30px 20px;

            margin-bottom: 35px;
        }


        /* =========================
           CATEGORY BUTTON
        ========================= */

        .category {

            border: none;

            background: transparent;

            cursor: pointer;

            text-align: center;

            color: #142b5a;

            font-size: 17px;

            font-weight: 600;

            padding: 5px;

            transition: 0.25s;
        }


        .category:hover {

            transform: translateY(-6px);
        }


        /* =========================
           3D ICON CIRCLE
        ========================= */

        .icon-circle {

            width: 105px;
            height: 105px;

            margin: 0 auto 12px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            box-shadow:
                0 8px 18px rgba(80, 90, 160, 0.10);

            transition: 0.25s;
        }


        .icon-circle img {

            width: 82px;
            height: 82px;

            object-fit: contain;

            display: block;

            transition: 0.25s;
        }


        .category:hover .icon-circle {

            transform: scale(1.05);

            box-shadow:
                0 12px 25px rgba(80, 90, 160, 0.18);
        }


        .category:hover .icon-circle img {

            transform: scale(1.08);
        }


        /* =========================
           DIFFERENT BACKGROUNDS
        ========================= */

        .blue {
            background: #dff2ff;
        }

        .pink {
            background: #ffe5ee;
        }

        .yellow {
            background: #fff4d9;
        }

        .purple {
            background: #f0e5ff;
        }

        .peach {
            background: #fff0df;
        }

        .lavender {
            background: #eee7ff;
        }

        .cyan {
            background: #def8f7;
        }

        .green {
            background: #e4f7e9;
        }


        /* =========================
           SELECTED
        ========================= */

        .category.selected {

            transform: scale(1.04);
        }


        .category.selected .icon-circle {

            box-shadow:
                0 0 0 4px #7054e6,
                0 10px 25px rgba(112,84,230,0.25);
        }


        .category.selected span {

            color: #7054e6;
        }


        /* =========================
           SELECTED TEXT
        ========================= */

        .selected-category {

            display: none;

            color: #7054e6;

            font-size: 15px;

            font-weight: bold;

            margin-bottom: 20px;
        }


        /* =========================
           FORM
        ========================= */

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 18px;

            font-weight: bold;

            color: #142b5a;
        }


        input,
        textarea {

            width: 100%;

            border: 2px solid #dce2f2;

            border-radius: 14px;

            padding: 16px 18px;

            margin-bottom: 22px;

            font-size: 16px;

            font-family: Arial, sans-serif;

            outline: none;

            color: #263b65;

            background: white;

            transition: 0.2s;
        }


        input {

            height: 62px;
        }


        textarea {

            height: 130px;

            resize: vertical;
        }


        input:focus,
        textarea:focus {

            border-color: #7054e6;

            box-shadow:
                0 0 0 4px rgba(112,84,230,0.08);
        }


        input::placeholder,
        textarea::placeholder {

            color: #91a0c2;
        }


        /* =========================
           SUBMIT BUTTON
        ========================= */

        .submit-btn {

            width: 100%;

            border: none;

            border-radius: 35px;

            padding: 18px;

            background:
                linear-gradient(
                    90deg,
                    #6d5bea,
                    #7665f2
                );

            color: white;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(112,84,230,0.25);

            transition: 0.25s;
        }


        .submit-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 12px 25px rgba(112,84,230,0.35);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .header h1 {

                font-size: 28px;
            }


            .complaint-box {

                padding: 25px 20px;
            }


            .complaint-box h2 {

                font-size: 27px;
            }


            .subtitle {

                font-size: 16px;
            }


            .categories {

                gap: 25px 8px;
            }


            .category {

                font-size: 14px;
            }


            .icon-circle {

                width: 85px;
                height: 85px;
            }


            .icon-circle img {

                width: 68px;
                height: 68px;
            }

        }


        @media (max-width: 430px) {

            .container {

                width: 94%;
            }


            .header {

                padding: 20px 10px;
            }


            .header h1 {

                font-size: 23px;

                gap: 8px;
            }


            .header-icon {

                width: 45px;
                height: 45px;
            }


            .complaint-box {

                padding: 22px 15px;
            }


            .complaint-box h2 {

                font-size: 24px;
            }


            .categories {

                grid-template-columns:
                    repeat(3, 1fr);

                gap: 22px 4px;
            }


            .category {

                font-size: 11px;
            }


            .icon-circle {

                width: 65px;
                height: 65px;
            }


            .icon-circle img {

                width: 52px;
                height: 52px;
            }


            input {

                height: 55px;
            }


            .submit-btn {

                font-size: 17px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <h1>

        <img
            class="header-icon"
            src="https://img.icons8.com/3d-fluency/94/complaint.png"
            alt="Report">

        Report a Traffic Problem

    </h1>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">

    <div class="complaint-box">


        <h2>
            What's the problem?
        </h2>


        <p class="subtitle">
            Select a category and describe the issue.
        </p>


        <!-- =========================
             CATEGORY ICONS
        ========================= -->

        <div class="categories">


            <!-- TRAFFIC JAM -->

            <button
                class="category"
                onclick="selectCategory(this, 'Traffic Jam')">

                <div class="icon-circle blue">

                    <img
                        src="https://img.icons8.com/3d-fluency/94/car.png"
                        alt="Traffic Jam">

                </div>

                <span>
                    Traffic Jam
                </span>

            </button>


            <!-- ACCIDENT -->

            <button
                class="category"
                onclick="selectCategory(this, 'Accident')">

                <div class="icon-circle pink">

                    <img
                        src="https://img.icons8.com/3d-fluency/94/car-crash.png"
                        alt="Accident">

                </div>

                <span>
                    Accident
                </span>

            </button>


            <!-- ROAD BLOCK -->

            <button
                class="category"
                onclick="selectCategory(this, 'Road Block')">

                <div class="icon-circle yellow">

                    <img
                        src="https://img.icons8.com/3d-fluency/94/traffic-barricade.png"
                        alt="Road Block">

                </div>

                <span>
                    Road Block
                </span>

            </button>


            <!-- SIGNAL -->

            <button
                class="category"
                onclick="selectCategory(this, 'Signal Problem')">

                <div class="icon-circle pink">

                    <img
                        src="https://img.icons8.com/3d-fluency/94/traffic-light.png"
                        alt="Signal Problem">

                </div>

                <span>
                    Signal Problem
                </span>

            </button>


            <!-- DAMAGED ROAD -->

            <button
                class="category"
                onclick="selectCategory(this, 'Damaged Road')">

                <div class="icon-circle peach">

                    <img
                        src="https://img.icons8.com/3d-fluency/94/road.png"
                        alt="Damaged Road">

                </div>

                <span>
                    Damaged Road
                </span>

            </button>


            <!-- ILLEGAL PARKING -->

            <button
                class="category"
                onclick="selectCategory(this, 'Illegal Parking')">

                <div class="icon-circle lavender">

                    <img
                        src="https://img.icons8.com/3d-fluency/94/parking.png"
                        alt="Illegal Parking">

                </div>

                <span>
                    Illegal Parking
                </span>

            </button>


            <!-- POTHOLE -->

            <button
                class="category"
                onclick="selectCategory(this, 'Pothole')">

                <div class="icon-circle blue">

                    <img
                        src="https://img.icons8.com/3d-fluency/94/road-closure.png"
                        alt="Pothole">

                </div>

                <span>
                    Pothole
                </span>

            </button>


            <!-- WRONG SIDE -->

            <button
                class="category"
                onclick="selectCategory(this, 'Wrong Side Driving')">

                <div class="icon-circle cyan">

                    <img
                        src="https://img.icons8.com/3d-fluency/94/no-entry.png"
                        alt="Wrong Side Driving">

                </div>

                <span>
                    Wrong Side Driving
                </span>

            </button>


            <!-- STREET LIGHT -->

            <button
                class="category"
                onclick="selectCategory(this, 'Street Light')">

                <div class="icon-circle yellow">

                    <img
                        src="https://img.icons8.com/3d-fluency/94/street-lamp.png"
                        alt="Street Light">

                </div>

                <span>
                    Street Light
                </span>

            </button>


            <!-- WATERLOGGING -->

            <button
                class="category"
                onclick="selectCategory(this, 'Waterlogging')">

                <div class="icon-circle blue">

                    <img
                        src="https://img.icons8.com/3d-fluency/94/water.png"
                        alt="Waterlogging">

                </div>

                <span>
                    Waterlogging
                </span>

            </button>


            <!-- SIGN BOARD -->

            <button
                class="category"
                onclick="selectCategory(this, 'Missing Sign Board')">

                <div class="icon-circle peach">

                    <img
                        src="https://img.icons8.com/3d-fluency/94/signpost.png"
                        alt="Missing Sign Board">

                </div>

                <span>
                    Missing Sign Board
                </span>

            </button>


            <!-- TRAFFIC VIOLATION -->

            <button
                class="category"
                onclick="selectCategory(this, 'Traffic Rule Violation')">

                <div class="icon-circle pink">

                    <img
                        src="https://img.icons8.com/3d-fluency/94/error.png"
                        alt="Traffic Rule Violation">

                </div>

                <span>
                    Traffic Rule Violation
                </span>

            </button>


        </div>


        <!-- SELECTED CATEGORY -->

        <div
            id="selectedCategory"
            class="selected-category">

        </div>


        <!-- LOCATION -->

        <label for="location">
            Location
        </label>


        <input
            type="text"
            id="location"
            placeholder="Example: Dwarka, Nashik">


        <!-- DESCRIPTION -->

        <label for="description">
            Describe the problem
        </label>


        <textarea
            id="description"
            placeholder="Describe the traffic problem..."
        ></textarea>


        <!-- SUBMIT -->

        <button
            class="submit-btn"
            onclick="submitComplaint()">

            ➤ &nbsp; Submit Complaint

        </button>


    </div>

</main>


<script>


    let selectedCategory = "";


    /* =========================
       SELECT CATEGORY
    ========================= */

    function selectCategory(button, category) {

        document
            .querySelectorAll(".category")
            .forEach(function(item) {

                item.classList.remove("selected");

            });


        button.classList.add("selected");


        selectedCategory = category;


        let selected =
            document.getElementById("selectedCategory");


        selected.style.display = "block";


        selected.innerHTML =
            "Selected Category: " + category;

    }


    /* =========================
       SUBMIT
    ========================= */

    function submitComplaint() {

        let location =
            document
            .getElementById("location")
            .value
            .trim();


        let description =
            document
            .getElementById("description")
            .value
            .trim();


        if (selectedCategory === "") {

            alert(
                "Please select a problem category."
            );

            return;
        }


        if (location === "") {

            alert(
                "Please enter the location."
            );

            return;
        }


        if (description === "") {

            alert(
                "Please describe the problem."
            );

            return;
        }


        alert(

            "Complaint submitted successfully!\n\n" +

            "Category: " +
            selectedCategory +

            "\nLocation: " +
            location

        );

    }

</script>


</body>

</html>
