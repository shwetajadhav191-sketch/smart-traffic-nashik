<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Traffic Alerts</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #eef5ff;
            margin: 0;
            padding: 40px;
        }

        .admin-container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #252b48;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-top: 18px;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .add-alert-btn {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6c4df6;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .add-alert-btn:hover {
            background: #5739d6;
        }
    </style>
</head>

<body>

    <div class="admin-container">

        <h1>🚨 Admin - Add Traffic Alert</h1>

        <p class="subtitle">
            Add a new traffic alert for Nashik.
        </p>

        <form id="alertForm">

            <label for="title">Alert Title</label>
            <input type="text" id="title" placeholder="Example: Heavy Traffic" required>

            <label for="location">Location</label>
            <input type="text" id="location" placeholder="Example: College Road, Nashik" required>

            <label for="description">Description</label>
            <textarea id="description" placeholder="Describe the traffic situation..." required></textarea>

            <label for="severity">Severity</label>
            <select id="severity">
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
            </select>

            <button type="submit" class="add-alert-btn">
                Add Traffic Alert
            </button>

        </form>

    </div>
    <script>
        document.getElementById("alertForm").addEventListener("submit", function (event) {

            event.preventDefault();

            const formData = new FormData();

            formData.append("title", document.getElementById("title").value);
            formData.append("location", document.getElementById("location").value);
            formData.append("description", document.getElementById("description").value);
            formData.append("severity", document.getElementById("severity").value);

            fetch("add_alert.php", {
                method: "POST",
                body: formData
            })
                .then(function (response) {
                    return response.text();
                })
                .then(function (result) {

                    if (result.includes("Traffic alert added successfully!")) {

                        alert("Traffic alert added successfully!");

                        document.getElementById("alertForm").reset();

                    } else {

                        alert("Something went wrong: " + result);

                    }

                })
                .catch(function (error) {

                    console.error(error);
                    alert("Unable to add traffic alert.");

                });

        });
    </script>
</body>

</html>
