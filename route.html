<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Route Suggestion - Smart Traffic Nashik</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css\route.css">



</head>

<body>

    <header class="header">

        <h1>
            <i class="fa-solid fa-route"></i>
            Find Your Best Route
        </h1>

    </header>


    <main class="container">

        <!-- ROUTE SEARCH -->

        <div class="card">

            <h2>Route Suggestion</h2>

            <label for="from">
                Starting Location
            </label>

            <input type="text" id="from" placeholder="Enter starting location">


            <label for="destination">
                Destination
            </label>

            <input type="text" id="destination" placeholder="Enter destination">


            <button class="route-btn" onclick="findRoute()">
                <i class="fa-solid fa-magnifying-glass"></i>
                Find Best Route
            </button>

        </div>


        <!-- COMPLAINT -->

        <div class="card">

            <h2>
                <i class="fa-solid fa-triangle-exclamation"></i>
                Facing a Traffic Problem?
            </h2>

            <p>
                Report an accident, traffic jam, road blockage,
                signal problem or other traffic issue.
            </p>

            <a href="complaint.html" class="complaint-btn">

                <i class="fa-solid fa-file-circle-exclamation"></i>

                Report Traffic / Complaint

            </a>

        </div>

    </main>


    <script>

        function findRoute() {

            let from = document.getElementById("from").value;
            let destination = document.getElementById("destination").value;

            if (from === "" || destination === "") {

                alert("Please enter both starting location and destination.");

                return;
            }

            alert(
                "Route suggestion will be displayed here."
            );

        }

    </script>

</body>

</html>
