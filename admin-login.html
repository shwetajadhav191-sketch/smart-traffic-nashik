<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Smart Traffic Nashik</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f3f6ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #292e46;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(75, 85, 130, 0.12);
            text-align: center;
        }

        .admin-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #6850e8;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777b8c;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9dce8;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #6850e8;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 25px;
            background: #6850e8;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #563fd1;
        }

        .message {
            margin-top: 15px;
            font-size: 13px;
            color: #d63333;
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #6850e8;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="admin-icon">🔐</div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Smart Traffic Nashik
        </p>

        <form id="adminLoginForm">

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <p id="message" class="message"></p>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Website
        </a>

    </div>

    <script>
        document.getElementById("adminLoginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (username === "admin" && password === "admin123") {

                window.location.href = "admin-dashboard.html";

            } else {

                message.textContent = "Invalid username or password.";

            }

        });
    </script>

</body>
</html>
